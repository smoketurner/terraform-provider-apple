name: Bug report
description: Something does not work as documented
type: Bug
body:
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `terraform version` (includes the provider version)
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Minimal Terraform configuration that reproduces the problem. Remove tokens.
      render: terraform
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include the full error output. `TF_LOG=DEBUG` output helps for API errors.
    validations:
      required: true
