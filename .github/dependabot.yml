version: 2
updates:
  - package-ecosystem: gomod
    directories: ["/", "/tools"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      terraform-plugin:
        patterns: ["github.com/hashicorp/terraform-plugin-*"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
