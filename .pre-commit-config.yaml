repos:
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -l -w
        language: system
        types: [go]
      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run ./...
        language: system
        types: [go]
        pass_filenames: false
      - id: go-mod-tidy
        name: go mod tidy
        entry: sh -c 'go mod tidy && cd tools && go mod tidy'
        language: system
        files: (^|/)go\.(mod|sum)$
        pass_filenames: false
      - id: terraform-fmt
        name: terraform fmt
        entry: terraform fmt
        language: system
        files: \.tf$
      - id: actionlint
        name: actionlint
        entry: actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
      # Audits the whole directory, so a change to actions.lock is checked
      # together with the workflows it locks.
      - id: zizmor
        name: zizmor
        entry: zizmor --offline .github/workflows
        language: system
        files: ^\.github/workflows/
        pass_filenames: false
