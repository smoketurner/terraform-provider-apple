version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - durationcheck
    - errorlint
    - forcetypeassert
    - gocritic
    - godot
    - gosec
    - misspell
    - nilerr
    - noctx
    - perfsprint
    - predeclared
    - revive
    - unconvert
    - unparam
    - usetesting
  settings:
    depguard:
      rules:
        main:
          list-mode: lax
          deny:
            - pkg: github.com/hashicorp/terraform-plugin-sdk/v2
              desc: Use the Terraform Plugin Framework
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - std-error-handling
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/smoketurner/terraform-provider-apple
